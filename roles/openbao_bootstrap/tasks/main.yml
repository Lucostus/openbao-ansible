---
- name: Set bootstrap host fact
  ansible.builtin.set_fact:
    openbao_bootstrap_host: "{{ groups[openbao_cluster_group][0] }}"

- name: Check OpenBao initialization status on bootstrap host
  ansible.builtin.command: bao status -format=json
  environment:
    BAO_ADDR: "{{ hostvars[openbao_bootstrap_host].openbao_cli_addr }}"
    VAULT_ADDR: "{{ hostvars[openbao_bootstrap_host].openbao_cli_addr }}"
    BAO_CACERT: "{{ hostvars[openbao_bootstrap_host].openbao_ca_cert_file }}"
    VAULT_CACERT: "{{ hostvars[openbao_bootstrap_host].openbao_ca_cert_file }}"
    BAO_TLS_SERVER_NAME: "{{ openbao_tls_server_name }}"
    VAULT_TLS_SERVER_NAME: "{{ openbao_tls_server_name }}"
  delegate_to: "{{ openbao_bootstrap_host }}"
  register: openbao_bootstrap_status
  changed_when: false
  failed_when: false
  run_once: true

- name: Assert OpenBao initialization status is readable
  ansible.builtin.assert:
    that:
      - openbao_bootstrap_status.stdout | default('', true) | trim | length > 0
      - openbao_bootstrap_status.stdout | trim is match('^\\{')
    fail_msg: >-
      Unable to read JSON OpenBao initialization status from
      {{ openbao_bootstrap_host }}. bao status exited with rc={{
      openbao_bootstrap_status.rc | default('unknown') }} and stderr={{
      openbao_bootstrap_status.stderr | default('') | trim }}.
  run_once: true

- name: Parse OpenBao initialization status
  ansible.builtin.set_fact:
    openbao_bootstrap_status_data: "{{ openbao_bootstrap_status.stdout | from_json }}"
  run_once: true

- name: Create secure artifact directory on controller
  ansible.builtin.file:
    path: "{{ openbao_secure_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Initialize OpenBao with recovery keys on bootstrap host
  ansible.builtin.command:
    argv:
      - bao
      - operator
      - init
      - "-recovery-shares={{ openbao_recovery_shares }}"
      - "-recovery-threshold={{ openbao_recovery_threshold }}"
      - -format=json
  environment:
    BAO_ADDR: "{{ hostvars[openbao_bootstrap_host].openbao_cli_addr }}"
    VAULT_ADDR: "{{ hostvars[openbao_bootstrap_host].openbao_cli_addr }}"
    BAO_CACERT: "{{ hostvars[openbao_bootstrap_host].openbao_ca_cert_file }}"
    VAULT_CACERT: "{{ hostvars[openbao_bootstrap_host].openbao_ca_cert_file }}"
    BAO_TLS_SERVER_NAME: "{{ openbao_tls_server_name }}"
    VAULT_TLS_SERVER_NAME: "{{ openbao_tls_server_name }}"
  delegate_to: "{{ openbao_bootstrap_host }}"
  register: openbao_init_result
  changed_when: true
  no_log: true
  run_once: true
  when: not (openbao_bootstrap_status_data.initialized | default(false) | bool)

- name: Store OpenBao init output only on the controller
  ansible.builtin.copy:
    content: "{{ openbao_init_result.stdout }}"
    dest: "{{ openbao_init_artifact }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  run_once: true
  when: openbao_init_result is defined and openbao_init_result is changed

- name: Wait for every OpenBao node to be initialized and unsealed
  ansible.builtin.command: bao status -format=json
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    VAULT_ADDR: "{{ openbao_cli_addr }}"
    BAO_CACERT: "{{ openbao_ca_cert_file }}"
    VAULT_CACERT: "{{ openbao_ca_cert_file }}"
    BAO_TLS_SERVER_NAME: "{{ openbao_tls_server_name }}"
    VAULT_TLS_SERVER_NAME: "{{ openbao_tls_server_name }}"
  register: openbao_node_status
  changed_when: false
  until:
    - openbao_node_status.rc == 0
    - (openbao_node_status.stdout | default('{}', true) | from_json).initialized | default(false) | bool
    - not ((openbao_node_status.stdout | default('{}', true) | from_json).sealed | default(true) | bool)
  retries: 60
  delay: 5

- name: Validate OpenBao Raft health after bootstrap
  ansible.builtin.include_role:
    name: openbao_common
    tasks_from: validate_raft_health
