---
- name: Set PKI leader host fact
  ansible.builtin.set_fact:
    openbao_pki_host: "{{ groups[openbao_cluster_group][0] }}"
  run_once: true

- name: Load init artifact when no operator token was supplied
  ansible.builtin.slurp:
    src: "{{ openbao_init_artifact }}"
  delegate_to: localhost
  become: false
  register: openbao_pki_init_artifact
  no_log: true
  run_once: true
  when: openbao_operator_token | length == 0

- name: Set OpenBao PKI token fact
  ansible.builtin.set_fact:
    openbao_pki_token: >-
      {{
        openbao_operator_token
        if openbao_operator_token | length > 0
        else ((openbao_pki_init_artifact.content | b64decode | from_json).root_token)
      }}
  no_log: true
  run_once: true

- name: Set OpenBao PKI command environment
  ansible.builtin.set_fact:
    openbao_pki_environment:
      BAO_ADDR: "{{ hostvars[openbao_pki_host].openbao_cli_addr }}"
      VAULT_ADDR: "{{ hostvars[openbao_pki_host].openbao_cli_addr }}"
      BAO_CACERT: "{{ hostvars[openbao_pki_host].openbao_ca_cert_file }}"
      VAULT_CACERT: "{{ hostvars[openbao_pki_host].openbao_ca_cert_file }}"
      BAO_TLS_SERVER_NAME: "{{ openbao_tls_server_name }}"
      VAULT_TLS_SERVER_NAME: "{{ openbao_tls_server_name }}"
      BAO_TOKEN: "{{ openbao_pki_token }}"
      VAULT_TOKEN: "{{ openbao_pki_token }}"
  no_log: true
  run_once: true

- name: Read OpenBao cluster status for artifact identity
  ansible.builtin.command: bao status -format=json
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  register: openbao_pki_cluster_status
  changed_when: false
  no_log: true
  run_once: true

- name: Set OpenBao cluster identifier for controller artifacts
  ansible.builtin.set_fact:
    openbao_pki_cluster_id: "{{ (openbao_pki_cluster_status.stdout | from_json).cluster_id }}"
  run_once: true

- name: Ensure secure artifact directory exists on controller
  ansible.builtin.file:
    path: "{{ openbao_secure_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Read existing audit devices
  ansible.builtin.command: bao audit list -format=json
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  register: openbao_audit_list
  changed_when: false
  no_log: true
  run_once: true

- name: Assert file audit logging is configured declaratively
  ansible.builtin.assert:
    that:
      - "'file/' in ((openbao_audit_list.stdout | from_json).keys() | list)"
    fail_msg: "File audit logging must be present from the OpenBao server audit stanza."
  run_once: true

- name: Read existing secret mounts
  ansible.builtin.command: bao secrets list -format=json
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  register: openbao_secret_mounts
  changed_when: false
  no_log: true
  run_once: true

- name: Enable OpenBao PKI mount
  ansible.builtin.command:
    argv:
      - bao
      - secrets
      - enable
      - "-path={{ openbao_pki_mount }}"
      - pki
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  changed_when: true
  no_log: true
  run_once: true
  when: "(openbao_pki_mount ~ '/') not in ((openbao_secret_mounts.stdout | from_json).keys() | list)"

- name: Tune PKI mount for ACME response headers and TTL
  ansible.builtin.command:
    argv:
      - bao
      - secrets
      - tune
      - "-max-lease-ttl={{ openbao_pki_intermediate_ttl }}"
      - -allowed-response-headers=Location
      - -allowed-response-headers=Replay-Nonce
      - -allowed-response-headers=Link
      - -allowed-response-headers=Last-Modified
      - "{{ openbao_pki_mount }}"
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  changed_when: false
  no_log: true
  run_once: true

- name: Check whether named PKI issuer exists
  ansible.builtin.command:
    argv:
      - bao
      - read
      - -format=json
      - "{{ openbao_pki_mount }}/issuer/{{ openbao_pki_issuer_name }}"
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  register: openbao_pki_issuer_check
  changed_when: false
  failed_when: false
  no_log: true
  run_once: true

- name: Generate and import OpenBao intermediate CA
  ansible.builtin.include_tasks: sign_intermediate.yml
  when: openbao_pki_issuer_check.rc != 0
  run_once: true

- name: Configure PKI issuing URLs
  ansible.builtin.command:
    argv:
      - bao
      - write
      - "{{ openbao_pki_mount }}/config/urls"
      - "issuing_certificates={{ openbao_public_api_addr }}/v1/{{ openbao_pki_mount }}/ca"
      - "crl_distribution_points={{ openbao_public_api_addr }}/v1/{{ openbao_pki_mount }}/crl"
      - "ocsp_servers={{ openbao_public_api_addr }}/v1/{{ openbao_pki_mount }}/ocsp"
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  changed_when: false
  no_log: true
  run_once: true

- name: Configure PKI cluster-local ACME path
  ansible.builtin.command:
    argv:
      - bao
      - write
      - "{{ openbao_pki_mount }}/config/cluster"
      - "path={{ openbao_pki_cluster_path }}"
      - "aia_path={{ openbao_pki_cluster_aia_path }}"
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  changed_when: false
  no_log: true
  run_once: true

- name: Configure listener certificate PKI role
  ansible.builtin.command:
    argv:
      - bao
      - write
      - "{{ openbao_pki_mount }}/roles/{{ openbao_acme_role_name }}"
      - "allowed_domains={{ openbao_acme_allowed_domains | join(',') }}"
      - "allow_bare_domains=true"
      - "allow_subdomains=false"
      - "allow_glob_domains=false"
      - "allow_wildcard_certificates=false"
      - "server_flag=true"
      - "client_flag=false"
      - "no_store=false"
      - "key_type=ec"
      - "key_bits=256"
      - "ttl={{ openbao_pki_leaf_ttl }}"
      - "max_ttl={{ openbao_pki_leaf_max_ttl }}"
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  changed_when: false
  no_log: true
  run_once: true
  when: openbao_acme_enabled | bool

- name: Enable ACME with external account binding
  ansible.builtin.command:
    argv:
      - bao
      - write
      - "{{ openbao_pki_mount }}/config/acme"
      - "enabled=true"
      - "default_directory_policy=role:{{ openbao_acme_role_name }}"
      - "allowed_roles={{ openbao_acme_role_name }}"
      - "eab_policy=always-required"
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  changed_when: false
  no_log: true
  run_once: true
  when: openbao_acme_enabled | bool

- name: Read listener ACME PKI role
  ansible.builtin.command:
    argv:
      - bao
      - read
      - -format=json
      - "{{ openbao_pki_mount }}/roles/{{ openbao_acme_role_name }}"
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  register: openbao_pki_acme_role_check
  changed_when: false
  no_log: true
  run_once: true
  when: openbao_acme_enabled | bool

- name: Assert listener ACME PKI role is configured
  ansible.builtin.assert:
    that:
      - openbao_public_fqdn in (((openbao_pki_acme_role_check.stdout | from_json).data.allowed_domains | default([])) | string)
      - not ((openbao_pki_acme_role_check.stdout | from_json).data.no_store | bool)
      - (openbao_pki_acme_role_check.stdout | from_json).data.server_flag | bool
    fail_msg: "OpenBao listener ACME PKI role is not configured for {{ openbao_public_fqdn }}."
  run_once: true
  when: openbao_acme_enabled | bool

- name: Read OpenBao ACME configuration
  ansible.builtin.command:
    argv:
      - bao
      - read
      - -format=json
      - "{{ openbao_pki_mount }}/config/acme"
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  register: openbao_pki_acme_config_check
  changed_when: false
  no_log: true
  run_once: true
  when: openbao_acme_enabled | bool

- name: Assert OpenBao ACME configuration is enabled with EAB
  ansible.builtin.assert:
    that:
      - (openbao_pki_acme_config_check.stdout | from_json).data.enabled | bool
      - (openbao_pki_acme_config_check.stdout | from_json).data.eab_policy == 'always-required'
      - openbao_acme_role_name in (((openbao_pki_acme_config_check.stdout | from_json).data.allowed_roles | default([])) | string)
    fail_msg: "OpenBao ACME config must be enabled with eab_policy=always-required for {{ openbao_acme_role_name }}."
  run_once: true
  when: openbao_acme_enabled | bool

- name: Create missing EAB credentials for each OpenBao node
  ansible.builtin.include_tasks: create_eab.yml
  loop: "{{ groups[openbao_cluster_group] }}"
  loop_control:
    loop_var: openbao_eab_host
  run_once: true
  when: openbao_acme_enabled | bool

- name: Check EAB artifacts for each OpenBao node
  ansible.builtin.stat:
    path: "{{ openbao_secure_artifacts_dir }}/{{ item }}-eab.json"
  delegate_to: localhost
  become: false
  loop: "{{ groups[openbao_cluster_group] }}"
  register: openbao_pki_eab_artifacts
  run_once: true
  when: openbao_acme_enabled | bool

- name: Assert EAB artifacts exist for every OpenBao node
  ansible.builtin.assert:
    that:
      - openbao_pki_eab_artifacts.results | map(attribute='stat.exists') | select('equalto', true) | list | length == groups[openbao_cluster_group] | length
    fail_msg: "Every OpenBao node needs a controller-side EAB artifact before listener ACME convergence."
  run_once: true
  when: openbao_acme_enabled | bool

- name: Read enabled auth methods
  ansible.builtin.command:
    argv:
      - bao
      - auth
      - list
      - -format=json
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  register: openbao_auth_methods
  changed_when: false
  no_log: true
  run_once: true
  when: openbao_agent_enabled | bool

- name: Assert OpenBao agent auth mount is AppRole when present
  ansible.builtin.assert:
    that:
      - ((openbao_auth_methods.stdout | from_json)[openbao_agent_auth_mount ~ '/'].type | default('')) == 'approle'
    fail_msg: "Auth mount {{ openbao_agent_auth_mount }}/ already exists but is not AppRole."
  run_once: true
  when:
    - openbao_agent_enabled | bool
    - (openbao_agent_auth_mount ~ '/') in ((openbao_auth_methods.stdout | from_json).keys() | list)

- name: Enable AppRole auth method for OpenBao agents
  ansible.builtin.command:
    argv:
      - bao
      - auth
      - enable
      - "-path={{ openbao_agent_auth_mount }}"
      - approle
  environment: "{{ openbao_pki_environment }}"
  delegate_to: "{{ openbao_pki_host }}"
  changed_when: true
  no_log: true
  run_once: true
  when:
    - openbao_agent_enabled | bool
    - (openbao_agent_auth_mount ~ '/') not in ((openbao_auth_methods.stdout | from_json).keys() | list)

- name: Configure per-node OpenBao agent PKI identities
  ansible.builtin.include_tasks: configure_agent_identity.yml
  loop: "{{ groups[openbao_cluster_group] }}"
  loop_control:
    loop_var: openbao_agent_host
  run_once: true
  when: openbao_agent_enabled | bool
