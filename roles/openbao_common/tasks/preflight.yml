---
- name: Assert this inventory contains exactly three OpenBao nodes
  ansible.builtin.assert:
    that:
      - groups[openbao_cluster_group] | length == 3
    fail_msg: "OpenBao HA deployment requires exactly 3 hosts in {{ openbao_cluster_group }}."
  run_once: true

- name: Assert supported OpenBao deployment options
  ansible.builtin.assert:
    that:
      - openbao_certificate_mode in ['agent', 'native_acme', 'bootstrap']
      - openbao_bootstrap_tls_source in ['controller', 'node']
      - openbao_bootstrap_tls_missing_strategy in ['fail', 'generate_self_signed', 'issue_from_node_subca']
      - openbao_bootstrap_tls_source != 'node' or openbao_certificate_mode in ['agent', 'bootstrap']
      - openbao_static_seal_source in ['generated_artifact', 'variable']
      - openbao_tls_trust_source in ['system', 'variable', 'file', 'node_subca']
      - openbao_pki_signing_source in ['variable', 'node_subca']
      - openbao_node_subca_topology in ['auto', 'single_signer', 'every_node']
      - not (openbao_agent_enabled | bool) or openbao_pki_enabled | bool
      - not (openbao_native_acme_enabled | bool) or openbao_pki_enabled | bool
      - openbao_native_acme_challenge in ['http-01', 'tls-alpn-01']
      - openbao_native_acme_cache_mode in ['nfs', 'pre_mounted']
      - openbao_certificate_mode != 'native_acme' or openbao_native_acme_enabled | bool
      - openbao_lb_mode in ['tcp_passthrough', 'tls_termination', 'none']
      - openbao_public_fqdn | length > 0
      - openbao_node_fqdn | length > 0
      - openbao_ca_cert_file is match('^/')
      - openbao_node_subca_cert_file is match('^/')
      - openbao_node_subca_key_file is match('^/')
      - openbao_node_subca_chain_file is match('^/')
      - not (openbao_node_subca_chain_build_enabled | bool) or openbao_node_subca_chain_issuer_path is match('^/')
      - not (openbao_node_subca_chain_build_enabled | bool) or openbao_node_subca_chain_file != openbao_node_subca_cert_file
      - openbao_node_subca_chain_mode is match('^0?[0-7]{3,4}$')
      - openbao_node_subca_bootstrap_artifact_dir is match('^/')
      - openbao_node_subca_bootstrap_key_file is match('^/')
      - openbao_node_subca_bootstrap_csr_file is match('^/')
      - openbao_node_subca_bootstrap_leaf_file is match('^/')
      - openbao_node_subca_bootstrap_fullchain_file is match('^/')
      - openbao_bootstrap_tls_missing_strategy != 'issue_from_node_subca' or openbao_bootstrap_tls_source == 'node'
      - not (openbao_native_acme_bootstrap_api_enabled | bool) or openbao_native_acme_bootstrap_api_port | int != openbao_listener_port | int
      - not (openbao_native_acme_bootstrap_api_enabled | bool) or openbao_native_acme_bootstrap_api_port | int != openbao_cluster_port | int
    fail_msg: "OpenBao TLS/LB/ACME variables are invalid; check the selected group_vars main.yml."

- name: Assert node sub-CA signing topology was resolved
  ansible.builtin.assert:
    that:
      - openbao_node_subca_available_hosts | default([]) | length > 0
      - openbao_node_subca_pki_signer_host | default('') in groups[openbao_cluster_group]
      - openbao_node_subca_pki_signer_host in openbao_node_subca_available_hosts
      - openbao_node_subca_chain_contents | default([]) | length > 0
      - "'BEGIN CERTIFICATE' in (openbao_node_subca_cluster_trust_bundle | default(''))"
      - >-
        openbao_node_subca_topology != 'auto'
        or openbao_node_subca_available_hosts | length in [1, groups[openbao_cluster_group] | length]
    fail_msg: "Node sub-CA signing is selected, but the signer topology was not resolved cleanly."
  when:
    - openbao_bootstrap_tls_missing_strategy == 'issue_from_node_subca'
      or openbao_pki_signing_source == 'node_subca'
      or openbao_tls_trust_source == 'node_subca'

- name: Assert advertised OpenBao addresses match the TLS listener
  ansible.builtin.assert:
    that:
      - openbao_api_addr is match('^https://')
      - openbao_cluster_addr is match('^https://')
      - openbao_cli_addr is match('^https://')
    fail_msg: "This role configures a TLS listener; OpenBao advertised API, cluster, and CLI addresses must use https://."

- name: Assert native ACME is only used with OpenBao versions that support it
  ansible.builtin.assert:
    that:
      - openbao_version is version('2.2.0', '>=')
    fail_msg: "openbao_certificate_mode=native_acme requires OpenBao 2.2.0 or newer."
  when: openbao_certificate_mode == 'native_acme'

- name: Assert native ACME NFS cache source is configured
  ansible.builtin.assert:
    that:
      - openbao_native_acme_cache_nfs_src | length > 0
      - openbao_native_acme_cache_path | length > 0
    fail_msg: >-
      openbao_certificate_mode=native_acme requires a shared NFS cache. Set
      openbao_native_acme_cache_nfs_src to the NFS export that all OpenBao
      nodes will mount at {{ openbao_native_acme_cache_path }}.
  when:
    - openbao_certificate_mode == 'native_acme'
    - openbao_native_acme_cache_mode == 'nfs'

- name: Assert native ACME pre-mounted cache path is configured
  ansible.builtin.assert:
    that:
      - openbao_native_acme_cache_path | length > 0
    fail_msg: "openbao_native_acme_cache_mode=pre_mounted requires openbao_native_acme_cache_path."
  when:
    - openbao_certificate_mode == 'native_acme'
    - openbao_native_acme_cache_mode == 'pre_mounted'

- name: Assert OpenBao Agent certificate renewal settings are valid
  ansible.builtin.assert:
    that:
      - openbao_agent_enabled | bool
      - openbao_agent_config_dir is match('^/')
      - openbao_agent_state_dir is match('^/')
      - openbao_agent_bundle_path is match('^/')
      - openbao_agent_bundle_template_path is match('^/')
      - openbao_agent_config_file is match('^/')
      - openbao_agent_hook_path is match('^/')
      - openbao_agent_role_id_path is match('^/')
      - openbao_agent_secret_id_path is match('^/')
      - openbao_agent_auth_mount | length > 0
      - "'/' not in openbao_agent_auth_mount"
      - openbao_agent_role_name | length > 0
      - openbao_agent_policy_name | length > 0
      - openbao_agent_cert_common_name | length > 0
      - openbao_agent_cert_dns_names | unique | length == openbao_agent_cert_dns_names | length
      - openbao_public_fqdn in openbao_agent_cert_dns_names
      - openbao_node_fqdn in openbao_agent_cert_dns_names
      - openbao_agent_cert_common_name in openbao_agent_cert_dns_names
      - openbao_agent_cert_ttl | length > 0
      - openbao_agent_restart_jitter_seconds | int >= 0
    fail_msg: "openbao_certificate_mode=agent has invalid OpenBao Agent certificate settings."
  when: openbao_certificate_mode == 'agent'

- name: Assert RHEL-like systemd host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - ansible_facts.service_mgr == 'systemd'
    fail_msg: "This playbook is written for RHEL-family hosts using systemd."

- name: Assert selected OpenBao node FQDNs are unique
  ansible.builtin.assert:
    that:
      - openbao_peer_fqdns | unique | length == groups[openbao_cluster_group] | length
    fail_msg: >-
      OpenBao node FQDNs must be unique. Current openbao_node_fqdn values are:
      {{ openbao_peer_fqdns | join(', ') }}.
  vars:
    openbao_peer_fqdns: >-
      {{
        groups[openbao_cluster_group]
        | map('extract', hostvars, 'openbao_node_fqdn')
        | map('string')
        | list
      }}
  run_once: true

- name: Assert managed peer addresses are unique and routable
  ansible.builtin.assert:
    that:
      - openbao_peer_host_entry_ips | reject('equalto', '') | list | length == groups[openbao_cluster_group] | length
      - openbao_peer_host_entry_ips | unique | length == groups[openbao_cluster_group] | length
    fail_msg: >-
      OpenBao Raft requires a unique routable peer address for every node when
      openbao_manage_hosts_entries=true. Current openbao_node_ip values are:
      {{ openbao_peer_host_entry_ips | join(', ') }}. SSH-only port forwards are
      not enough for OpenBao HA; set per-host openbao_node_ip/openbao_node_fqdn
      values that the nodes can reach on {{ openbao_listener_port }}/{{ openbao_cluster_port }},
      or disable managed host entries and provide working DNS.
  vars:
    openbao_peer_host_entry_ips: >-
      {{
        groups[openbao_cluster_group]
        | map('extract', hostvars, 'openbao_node_ip')
        | map('string')
        | list
      }}
  run_once: true
  when: openbao_manage_hosts_entries | bool

- name: Validate peer FQDN resolution when host entries are unmanaged
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ hostvars[item].openbao_node_fqdn }}"
  loop: "{{ groups[openbao_cluster_group] }}"
  register: openbao_peer_dns_resolution
  changed_when: false
  failed_when: openbao_peer_dns_resolution.rc != 0
  when: not (openbao_manage_hosts_entries | bool)

- name: Resolve bootstrap TLS source inputs
  ansible.builtin.include_tasks: resolve_bootstrap_tls.yml

- name: Assert variable static unseal key is present
  ansible.builtin.assert:
    that:
      - openbao_static_unseal_key_b64 is defined
    fail_msg: "openbao_static_seal_source=variable requires openbao_static_unseal_key_b64."
  no_log: true
  when: openbao_static_seal_source == 'variable'

- name: Assert variable TLS trust certificate is present
  ansible.builtin.assert:
    that:
      - openbao_root_ca_cert_pem is defined
      - "'BEGIN CERTIFICATE' in openbao_root_ca_cert_pem"
    fail_msg: "openbao_tls_trust_source=variable requires openbao_root_ca_cert_pem."
  no_log: true
  when: openbao_tls_trust_source == 'variable'

- name: Assert variable PKI signing inputs are present
  ansible.builtin.assert:
    that:
      - openbao_root_ca_cert_pem is defined
      - openbao_root_ca_key_pem is defined
      - "'BEGIN CERTIFICATE' in openbao_root_ca_cert_pem"
      - "'BEGIN' in openbao_root_ca_key_pem"
    fail_msg: >-
      openbao_pki_enabled=true with openbao_pki_signing_source=variable
      requires openbao_root_ca_cert_pem and openbao_root_ca_key_pem. Bootstrap
      mode skips PKI by default; provide a signing source before enabling
      Agent or native ACME certificate renewal.
  no_log: true
  when:
    - openbao_pki_enabled | bool
    - openbao_pki_signing_source == 'variable'

- name: Validate static unseal key length
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - -c
      - |
        import base64, os, sys
        raw = base64.b64decode(os.environ["OPENBAO_STATIC_KEY_B64"], validate=True)
        sys.exit(0 if len(raw) == 32 else 1)
  environment:
    OPENBAO_STATIC_KEY_B64: "{{ openbao_static_unseal_key_b64 }}"
  changed_when: false
  no_log: true
  when: openbao_static_seal_source == 'variable'

- name: Assert shared-name native ACME HTTP challenge routing is confirmed
  ansible.builtin.assert:
    that:
      - openbao_native_acme_http_routed | bool
    fail_msg: "native_acme with http-01 behind a shared TCP LB needs shared cache and confirmed HTTP challenge routing."
  when:
    - openbao_certificate_mode == 'native_acme'
    - openbao_public_fqdn in openbao_native_acme_allowed_domains
    - openbao_native_acme_challenge == 'http-01'

- name: Assert shared-name TLS-ALPN routing is confirmed
  ansible.builtin.assert:
    that:
      - openbao_native_acme_tls_alpn_routed | bool
    fail_msg: >-
      native_acme with tls-alpn-01 requires the L4 load balancer to forward
      {{ openbao_public_fqdn }}:443 to the OpenBao listener while preserving
      TCP/TLS passthrough and ALPN.
  when:
    - openbao_certificate_mode == 'native_acme'
    - openbao_public_fqdn in openbao_native_acme_allowed_domains
    - openbao_native_acme_challenge == 'tls-alpn-01'
