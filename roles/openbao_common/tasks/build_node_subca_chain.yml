---
- name: Assert node sub-CA chain build input is configured
  ansible.builtin.assert:
    that:
      - openbao_node_subca_chain_issuer_path | length > 0
      - openbao_node_subca_chain_issuer_path is match('^/')
      - openbao_node_subca_chain_file is match('^/')
      - openbao_node_subca_chain_issuer_path != openbao_node_subca_chain_file
      - openbao_node_subca_chain_file != openbao_node_subca_cert_file
    fail_msg: >-
      openbao_node_subca_chain_build_enabled=true requires
      openbao_node_subca_chain_issuer_path to be an absolute issuer/root PEM
      file or directory, and openbao_node_subca_chain_file must be distinct
      from both openbao_node_subca_chain_issuer_path and
      openbao_node_subca_cert_file.

- name: Check node sub-CA certificate before chain build
  ansible.builtin.stat:
    path: "{{ openbao_node_subca_cert_file }}"
  register: openbao_node_subca_chain_build_cert_stat

- name: Check node sub-CA chain issuer path
  ansible.builtin.stat:
    path: "{{ openbao_node_subca_chain_issuer_path }}"
  register: openbao_node_subca_chain_issuer_stat
  when: openbao_node_subca_chain_build_cert_stat.stat.exists | default(false)

- name: Assert node sub-CA chain issuer path exists
  ansible.builtin.assert:
    that:
      - openbao_node_subca_chain_issuer_stat.stat.exists | default(false)
      - >-
        openbao_node_subca_chain_issuer_stat.stat.isdir | default(false)
        or openbao_node_subca_chain_issuer_stat.stat.isreg | default(false)
    fail_msg: >-
      {{ openbao_node_subca_chain_issuer_path }} must exist on
      {{ inventory_hostname }} as either a PEM issuer/root file or a directory
      containing PEM issuer/root certificates when
      {{ openbao_node_subca_cert_file }} exists.
  when: openbao_node_subca_chain_build_cert_stat.stat.exists | default(false)

- name: Build node sub-CA public chain from issuer path
  ansible.builtin.shell: |
    set -euo pipefail

    tmpdir="$(mktemp -d)"
    trap 'rm -rf "${tmpdir}"' EXIT

    subca_only="${tmpdir}/subca.pem"
    issuer_bundle="${tmpdir}/issuer-bundle.pem"
    chain_candidate="${tmpdir}/chain.pem"
    seen_fingerprints="${tmpdir}/seen-fingerprints.txt"

    : > "${seen_fingerprints}"

    write_first_cert_pem() {
      local source_file="$1"
      local output_file="$2"

      if openssl x509 -in "${source_file}" -outform PEM > "${output_file}" 2>/dev/null; then
        return 0
      fi

      if openssl x509 -inform DER -in "${source_file}" -outform PEM > "${output_file}" 2>/dev/null; then
        return 0
      fi

      return 1
    }

    split_pem_certs() {
      local source_file="$1"
      local output_dir="$2"
      local prefix="$3"

      awk -v dir="${output_dir}" -v prefix="${prefix}" '
        /-----BEGIN CERTIFICATE-----/ {
          cert_index++
          cert_file = sprintf("%s/%s-%04d.pem", dir, prefix, cert_index)
          in_cert = 1
        }
        in_cert { print > cert_file }
        /-----END CERTIFICATE-----/ && in_cert {
          close(cert_file)
          in_cert = 0
        }
      ' "${source_file}"
    }

    cert_fingerprint() {
      openssl x509 -in "$1" -noout -sha256 -fingerprint \
        | awk -F= '{ gsub(/:/, "", $2); print toupper($2) }'
    }

    cert_is_ca() {
      local cert_file="$1"

      openssl x509 -in "${cert_file}" -noout -text | awk '
        /X509v3 Basic Constraints/ { in_basic = 1; next }
        in_basic {
          if ($0 ~ /CA:TRUE/) ca_true = 1
          if ($0 ~ /^[[:space:]]*X509v3 /) in_basic = 0
        }
        /X509v3 Key Usage/ { key_usage_seen = 1; in_key_usage = 1; next }
        in_key_usage {
          if ($0 ~ /Certificate Sign|keyCertSign/) key_cert_sign = 1
          if ($0 ~ /^[[:space:]]*X509v3 /) in_key_usage = 0
        }
        END {
          exit (ca_true && (!key_usage_seen || key_cert_sign)) ? 0 : 1
        }
      '
    }

    append_ca_cert_if_usable() {
      local candidate_cert="$1"
      local subca_fingerprint="$2"
      local candidate_fingerprint

      if ! openssl x509 -in "${candidate_cert}" -noout >/dev/null 2>&1; then
        return 0
      fi

      if ! cert_is_ca "${candidate_cert}"; then
        return 0
      fi

      candidate_fingerprint="$(cert_fingerprint "${candidate_cert}")"
      if [[ "${candidate_fingerprint}" == "${subca_fingerprint}" ]]; then
        return 0
      fi

      if grep -Fxq "${candidate_fingerprint}" "${seen_fingerprints}"; then
        return 0
      fi

      printf '%s\n' "${candidate_fingerprint}" >> "${seen_fingerprints}"
      openssl x509 -in "${candidate_cert}" -outform PEM >> "${issuer_bundle}"
      printf '\n' >> "${issuer_bundle}"
    }

    append_ca_certs_from_file() {
      local source_file="$1"
      local subca_fingerprint="$2"
      local split_dir
      local der_candidate

      split_dir="$(mktemp -d "${tmpdir}/issuer.XXXXXX")"
      if grep -q -- '-----BEGIN CERTIFICATE-----' "${source_file}"; then
        split_pem_certs "${source_file}" "${split_dir}" issuer
      else
        der_candidate="${split_dir}/issuer-0001.pem"
        openssl x509 -inform DER -in "${source_file}" -outform PEM > "${der_candidate}" 2>/dev/null || true
      fi

      while IFS= read -r -d '' cert_file; do
        append_ca_cert_if_usable "${cert_file}" "${subca_fingerprint}"
      done < <(
        find "${split_dir}" -maxdepth 1 -type f -name 'issuer-*.pem' -print0 \
          | sort -z
      )
    }

    normalize_pem_bundle() {
      local source_file="$1"
      local output_file="$2"
      local split_dir
      split_dir="$(mktemp -d "${tmpdir}/normalize.XXXXXX")"

      awk -v dir="${split_dir}" '
        /-----BEGIN CERTIFICATE-----/ {
          cert_index++
          cert_file = sprintf("%s/cert-%04d.pem", dir, cert_index)
          in_cert = 1
        }
        in_cert { print > cert_file }
        /-----END CERTIFICATE-----/ && in_cert {
          close(cert_file)
          in_cert = 0
        }
      ' "${source_file}"

      : > "${output_file}"
      while IFS= read -r -d '' cert_file; do
        openssl x509 -in "${cert_file}" -outform PEM >> "${output_file}"
        printf '\n' >> "${output_file}"
      done < <(
        find "${split_dir}" -maxdepth 1 -type f -name 'cert-*.pem' -print0 \
          | sort -z
      )
    }

    if ! write_first_cert_pem "${OPENBAO_NODE_SUBCA_CERT_FILE}" "${subca_only}"; then
      printf 'subCA certificate is not valid PEM or DER X.509: %s\n' \
        "${OPENBAO_NODE_SUBCA_CERT_FILE}" >&2
      exit 1
    fi

    if [[ ! -s "${subca_only}" ]]; then
      printf 'subCA certificate did not contain a PEM certificate: %s\n' \
        "${OPENBAO_NODE_SUBCA_CERT_FILE}" >&2
      exit 1
    fi

    if ! openssl x509 -in "${subca_only}" -noout >/dev/null 2>&1; then
      printf 'subCA certificate is not valid PEM X.509: %s\n' \
        "${OPENBAO_NODE_SUBCA_CERT_FILE}" >&2
      exit 1
    fi

    if ! cert_is_ca "${subca_only}"; then
      printf '%s is not a CA certificate. It appears to be a leaf/listener certificate. Set openbao_node_subca_cert_file to the actual enterprise subCA certificate.\n' \
        "${OPENBAO_NODE_SUBCA_CERT_FILE}" >&2
      exit 1
    fi

    subca_fingerprint="$(cert_fingerprint "${subca_only}")"

    : > "${issuer_bundle}"
    if [[ -d "${OPENBAO_NODE_SUBCA_CHAIN_ISSUER_PATH}" ]]; then
      while IFS= read -r -d '' issuer_file; do
        append_ca_certs_from_file "${issuer_file}" "${subca_fingerprint}"
      done < <(
        find "${OPENBAO_NODE_SUBCA_CHAIN_ISSUER_PATH}" -maxdepth 1 -type f -print0 \
          | sort -z
      )
    else
      append_ca_certs_from_file "${OPENBAO_NODE_SUBCA_CHAIN_ISSUER_PATH}" "${subca_fingerprint}"
    fi

    if [[ ! -s "${issuer_bundle}" ]]; then
      printf 'issuer path did not contain any usable CA certificates: %s\n' \
        "${OPENBAO_NODE_SUBCA_CHAIN_ISSUER_PATH}" >&2
      exit 1
    fi

    if ! openssl crl2pkcs7 -nocrl -certfile "${issuer_bundle}" \
      | openssl pkcs7 -print_certs -noout >/dev/null 2>&1; then
      printf 'issuer bundle is not valid PEM certificate data: %s\n' \
        "${OPENBAO_NODE_SUBCA_CHAIN_ISSUER_PATH}" >&2
      exit 1
    fi

    if ! openssl verify -CAfile "${issuer_bundle}" "${subca_only}" >/dev/null 2>&1; then
      printf 'subCA certificate does not verify against issuer bundle.\n' >&2
      printf '  subCA:  %s\n' "${OPENBAO_NODE_SUBCA_CERT_FILE}" >&2
      printf '  issuer: %s\n' "${OPENBAO_NODE_SUBCA_CHAIN_ISSUER_PATH}" >&2
      exit 1
    fi

    {
      openssl x509 -in "${subca_only}" -outform PEM
      printf '\n'
      cat "${issuer_bundle}"
    } > "${chain_candidate}"
    normalized_candidate="${tmpdir}/chain.normalized.pem"
    normalized_current="${tmpdir}/current.normalized.pem"
    normalize_pem_bundle "${chain_candidate}" "${normalized_candidate}"

    out_dir="$(dirname "${OPENBAO_NODE_SUBCA_CHAIN_FILE}")"
    if [[ ! -d "${out_dir}" ]]; then
      install -d -m 0755 "${out_dir}"
    fi

    if [[ -f "${OPENBAO_NODE_SUBCA_CHAIN_FILE}" ]]; then
      normalize_pem_bundle "${OPENBAO_NODE_SUBCA_CHAIN_FILE}" "${normalized_current}"
    fi

    candidate_hash="$(sha256sum "${normalized_candidate}" | awk '{ print $1 }')"
    current_hash=""
    if [[ -f "${OPENBAO_NODE_SUBCA_CHAIN_FILE}" ]]; then
      current_hash="$(sha256sum "${normalized_current}" | awk '{ print $1 }')"
    fi

    if [[ -f "${OPENBAO_NODE_SUBCA_CHAIN_FILE}" ]] \
      && [[ "${candidate_hash}" == "${current_hash}" ]]; then
      printf 'openbao-node-subca-chain-current\n'
    else
      install \
        -m "${OPENBAO_NODE_SUBCA_CHAIN_MODE}" \
        -o "${OPENBAO_NODE_SUBCA_CHAIN_OWNER}" \
        -g "${OPENBAO_NODE_SUBCA_CHAIN_GROUP}" \
        "${normalized_candidate}" \
        "${OPENBAO_NODE_SUBCA_CHAIN_FILE}"
      printf 'openbao-node-subca-chain-changed\n'
    fi
  args:
    executable: /bin/bash
  environment:
    OPENBAO_NODE_SUBCA_CERT_FILE: "{{ openbao_node_subca_cert_file }}"
    OPENBAO_NODE_SUBCA_CHAIN_FILE: "{{ openbao_node_subca_chain_file }}"
    OPENBAO_NODE_SUBCA_CHAIN_ISSUER_PATH: "{{ openbao_node_subca_chain_issuer_path }}"
    OPENBAO_NODE_SUBCA_CHAIN_OWNER: "{{ openbao_node_subca_chain_owner }}"
    OPENBAO_NODE_SUBCA_CHAIN_GROUP: "{{ openbao_node_subca_chain_group }}"
    OPENBAO_NODE_SUBCA_CHAIN_MODE: "{{ openbao_node_subca_chain_mode }}"
  register: openbao_node_subca_chain_build_result
  changed_when: "'openbao-node-subca-chain-changed' in openbao_node_subca_chain_build_result.stdout"
  failed_when: openbao_node_subca_chain_build_result.rc != 0
  when: openbao_node_subca_chain_build_cert_stat.stat.exists | default(false)
