---
- name: Load OpenBao non-secret variables
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../group_vars/rhel10/main.yml"

- name: Check for OpenBao vaulted variables
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../group_vars/rhel10/vault.yml"
  delegate_to: localhost
  become: false
  register: openbao_common_loaded_vault_vars_stat

- name: Load OpenBao vaulted variables when present
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../group_vars/rhel10/vault.yml"
  no_log: true
  when: openbao_common_loaded_vault_vars_stat.stat.exists
