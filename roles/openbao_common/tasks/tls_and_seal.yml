---
- name: Install OpenBao root CA certificate
  ansible.builtin.copy:
    content: "{{ openbao_root_ca_cert_pem }}"
    dest: "{{ openbao_ca_cert_file }}"
    owner: root
    group: "{{ openbao_service_group }}"
    mode: "0644"
  no_log: true
  when: openbao_tls_trust_source == 'variable'

- name: Resolve bootstrap TLS source inputs
  ansible.builtin.include_tasks: resolve_bootstrap_tls.yml

- name: Install controller bootstrap OpenBao listener certificate
  ansible.builtin.copy:
    src: "{{ openbao_bootstrap_tls_effective_cert }}"
    dest: "{{ openbao_tls_cert_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0640"
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'controller'

- name: Install controller bootstrap OpenBao listener private key
  ansible.builtin.copy:
    src: "{{ openbao_bootstrap_tls_effective_key }}"
    dest: "{{ openbao_tls_key_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0600"
  no_log: true
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'controller'

- name: Install node bootstrap OpenBao listener certificate
  ansible.builtin.copy:
    remote_src: true
    src: "{{ openbao_bootstrap_tls_effective_cert }}"
    dest: "{{ openbao_tls_cert_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0640"
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'node'
    - openbao_node_bootstrap_tls_chain | length == 0

- name: Read node bootstrap OpenBao listener certificate
  ansible.builtin.slurp:
    src: "{{ openbao_bootstrap_tls_effective_cert }}"
  register: openbao_remote_bootstrap_cert_content
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'node'
    - openbao_node_bootstrap_tls_chain | length > 0

- name: Install node bootstrap OpenBao listener certificate with controller-side chain
  ansible.builtin.copy:
    content: >-
      {{
        (openbao_remote_bootstrap_cert_content.content | b64decode | trim)
        ~ '\n'
        ~ (lookup('ansible.builtin.file', openbao_node_bootstrap_tls_chain) | trim)
        ~ '\n'
      }}
    dest: "{{ openbao_tls_cert_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0640"
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'node'
    - openbao_node_bootstrap_tls_chain | length > 0

- name: Install node bootstrap OpenBao listener private key
  ansible.builtin.copy:
    remote_src: true
    src: "{{ openbao_bootstrap_tls_effective_key }}"
    dest: "{{ openbao_tls_key_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0600"
  no_log: true
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'node'

- name: Validate bootstrap listener certificate parses
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ openbao_tls_cert_file }}"
      - -noout
  register: openbao_bootstrap_cert_parse
  changed_when: false
  failed_when: openbao_bootstrap_cert_parse.rc != 0
  when: openbao_bootstrap_tls_install_needed | bool

- name: Validate bootstrap listener private key parses
  ansible.builtin.command:
    argv:
      - openssl
      - pkey
      - -in
      - "{{ openbao_tls_key_file }}"
      - -noout
  register: openbao_bootstrap_key_parse
  changed_when: false
  failed_when: openbao_bootstrap_key_parse.rc != 0
  no_log: true
  when: openbao_bootstrap_tls_install_needed | bool

- name: Validate bootstrap listener certificate and private key match
  ansible.builtin.shell: |
    set -euo pipefail
    cert_hash="$(
      openssl x509 -in "${OPENBAO_TLS_CERT_FILE}" -pubkey -noout \
        | openssl pkey -pubin -outform DER \
        | openssl dgst -sha256 -binary \
        | openssl base64 -A
    )"
    key_hash="$(
      openssl pkey -in "${OPENBAO_TLS_KEY_FILE}" -pubout -outform DER \
        | openssl dgst -sha256 -binary \
        | openssl base64 -A
    )"
    test "${cert_hash}" = "${key_hash}"
  args:
    executable: /bin/bash
  environment:
    OPENBAO_TLS_CERT_FILE: "{{ openbao_tls_cert_file }}"
    OPENBAO_TLS_KEY_FILE: "{{ openbao_tls_key_file }}"
  register: openbao_bootstrap_key_match
  changed_when: false
  failed_when: openbao_bootstrap_key_match.rc != 0
  no_log: true
  when: openbao_bootstrap_tls_install_needed | bool

- name: Validate bootstrap listener certificate chain
  ansible.builtin.shell: |
    set -euo pipefail
    tmpdir="$(mktemp -d)"
    trap 'rm -rf "${tmpdir}"' EXIT
    leaf="${tmpdir}/leaf.pem"
    chain="${tmpdir}/chain.pem"
    awk -v leaf="${leaf}" -v chain="${chain}" '
      /-----BEGIN CERTIFICATE-----/ { cert_index++ }
      cert_index == 1 { print > leaf }
      cert_index > 1 { print > chain }
    ' "${OPENBAO_TLS_CERT_FILE}"
    test -s "${leaf}"
    if test -s "${chain}"; then
      openssl verify -CAfile "${OPENBAO_CA_CERT_FILE}" -untrusted "${chain}" "${leaf}"
    else
      openssl verify -CAfile "${OPENBAO_CA_CERT_FILE}" "${leaf}"
    fi
  args:
    executable: /bin/bash
  environment:
    OPENBAO_TLS_CERT_FILE: "{{ openbao_tls_cert_file }}"
    OPENBAO_CA_CERT_FILE: "{{ openbao_ca_cert_file }}"
  register: openbao_bootstrap_chain_verify
  changed_when: false
  failed_when: openbao_bootstrap_chain_verify.rc != 0
  when: openbao_bootstrap_tls_install_needed | bool

- name: Validate bootstrap listener certificate DNS names
  ansible.builtin.shell: |
    set -euo pipefail
    cert_text="$(openssl x509 -in "${OPENBAO_TLS_CERT_FILE}" -noout -text)"
    for name in "${OPENBAO_PUBLIC_FQDN}" "${OPENBAO_NODE_FQDN}"; do
      printf '%s\n' "${cert_text}" | grep -F "DNS:${name}" >/dev/null
    done
  args:
    executable: /bin/bash
  environment:
    OPENBAO_TLS_CERT_FILE: "{{ openbao_tls_cert_file }}"
    OPENBAO_PUBLIC_FQDN: "{{ openbao_public_fqdn }}"
    OPENBAO_NODE_FQDN: "{{ openbao_node_fqdn }}"
  register: openbao_bootstrap_dns_names
  changed_when: false
  failed_when: openbao_bootstrap_dns_names.rc != 0
  when: openbao_bootstrap_tls_install_needed | bool

- name: Install static auto-unseal key as raw bytes
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - -c
      - |
        import base64, os, pathlib, sys
        path = pathlib.Path(os.environ["OPENBAO_STATIC_KEY_PATH"])
        raw = base64.b64decode(os.environ["OPENBAO_STATIC_KEY_B64"], validate=True)
        if path.exists() and path.read_bytes() == raw:
            path.chmod(0o600)
            sys.exit(0)
        path.write_bytes(raw)
        path.chmod(0o600)
        sys.exit(2)
  environment:
    OPENBAO_STATIC_KEY_B64: "{{ openbao_static_unseal_key_b64 }}"
    OPENBAO_STATIC_KEY_PATH: "{{ openbao_static_unseal_key_path }}"
  no_log: true
  changed_when: openbao_static_key_write.rc == 2
  failed_when: openbao_static_key_write.rc not in [0, 2]
  register: openbao_static_key_write

- name: Set static auto-unseal key ownership
  ansible.builtin.file:
    path: "{{ openbao_static_unseal_key_path }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0600"
