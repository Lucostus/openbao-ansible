---
- name: Install OpenBao root CA certificate
  ansible.builtin.copy:
    content: "{{ openbao_root_ca_cert_pem }}"
    dest: "{{ openbao_ca_cert_file }}"
    owner: root
    group: "{{ openbao_service_group }}"
    mode: "0644"
  no_log: true
  when: openbao_tls_trust_source == 'variable'

- name: Resolve bootstrap TLS source inputs
  ansible.builtin.include_tasks: resolve_bootstrap_tls.yml

- name: Install OpenBao node sub-CA trust bundle
  ansible.builtin.copy:
    content: |
      {% for openbao_node_subca_chain in openbao_node_subca_chain_contents %}
      {{ openbao_node_subca_chain | trim }}
      {% endfor %}
    dest: "{{ openbao_managed_ca_cert_file }}"
    owner: root
    group: "{{ openbao_service_group }}"
    mode: "0644"
  when:
    - openbao_tls_trust_source == 'node_subca'
      or openbao_bootstrap_tls_effective_source | default('') == 'generated_node_subca'

- name: Set generated bootstrap certificate SANs
  ansible.builtin.set_fact:
    openbao_bootstrap_selfsigned_dns_subject_alt_names: >-
      {{
        [
          'DNS:' ~ openbao_public_fqdn,
          'DNS:' ~ openbao_node_fqdn,
          'DNS:' ~ inventory_hostname,
          ('DNS:' ~ ansible_hostname) if (ansible_hostname | default('') | length > 0) else '',
          ('DNS:' ~ ansible_fqdn) if (ansible_fqdn | default('') | length > 0) else ''
        ]
        | reject('equalto', '')
        | unique
        | list
      }}
    openbao_bootstrap_selfsigned_ip_subject_alt_names: >-
      {{
        [
          ('IP:' ~ openbao_node_ip) if (openbao_node_ip | default('') is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')) else '',
          ('IP:' ~ ansible_host) if (ansible_host | default('') is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')) else ''
        ]
        | reject('equalto', '')
        | unique
        | list
      }}
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_using_selfsigned | bool
      or openbao_bootstrap_tls_using_node_subca | bool

- name: Create generated bootstrap TLS artifact directory
  ansible.builtin.file:
    path: "{{ openbao_bootstrap_selfsigned_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_using_selfsigned | bool

- name: Generate bootstrap self-signed CA private key
  community.crypto.openssl_privatekey:
    path: "{{ openbao_bootstrap_selfsigned_ca_key }}"
    type: RSA
    size: 4096
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_using_selfsigned | bool

- name: Generate bootstrap self-signed CA CSR
  community.crypto.openssl_csr:
    path: "{{ openbao_bootstrap_selfsigned_artifacts_dir }}/bootstrap-ca.csr"
    privatekey_path: "{{ openbao_bootstrap_selfsigned_ca_key }}"
    common_name: OpenBao temporary bootstrap CA
    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_using_selfsigned | bool

- name: Generate bootstrap self-signed CA certificate
  community.crypto.x509_certificate:
    path: "{{ openbao_bootstrap_selfsigned_ca_cert }}"
    privatekey_path: "{{ openbao_bootstrap_selfsigned_ca_key }}"
    csr_path: "{{ openbao_bootstrap_selfsigned_artifacts_dir }}/bootstrap-ca.csr"
    provider: selfsigned
    selfsigned_not_after: "+{{ openbao_bootstrap_selfsigned_ca_days }}d"
    ignore_timestamps: true
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_using_selfsigned | bool

- name: Generate bootstrap listener private key
  community.crypto.openssl_privatekey:
    path: "{{ openbao_bootstrap_selfsigned_leaf_key }}"
    type: RSA
    size: 2048
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_using_selfsigned | bool

- name: Generate bootstrap listener CSR
  community.crypto.openssl_csr:
    path: "{{ openbao_bootstrap_selfsigned_artifacts_dir }}/{{ inventory_hostname }}.csr"
    privatekey_path: "{{ openbao_bootstrap_selfsigned_leaf_key }}"
    common_name: "{{ openbao_node_fqdn }}"
    basic_constraints:
      - "CA:FALSE"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
    subject_alt_name: "{{ openbao_bootstrap_selfsigned_dns_subject_alt_names + openbao_bootstrap_selfsigned_ip_subject_alt_names }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_using_selfsigned | bool

- name: Generate bootstrap listener certificate
  community.crypto.x509_certificate:
    path: "{{ openbao_bootstrap_selfsigned_artifacts_dir }}/{{ inventory_hostname }}.leaf.pem"
    privatekey_path: "{{ openbao_bootstrap_selfsigned_leaf_key }}"
    csr_path: "{{ openbao_bootstrap_selfsigned_artifacts_dir }}/{{ inventory_hostname }}.csr"
    provider: ownca
    ownca_path: "{{ openbao_bootstrap_selfsigned_ca_cert }}"
    ownca_privatekey_path: "{{ openbao_bootstrap_selfsigned_ca_key }}"
    ownca_not_after: "+{{ openbao_bootstrap_selfsigned_leaf_days }}d"
    ignore_timestamps: true
    mode: "0644"
  delegate_to: localhost
  become: false
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_using_selfsigned | bool

- name: Build bootstrap listener fullchain
  ansible.builtin.copy:
    content: |
      {{ lookup('ansible.builtin.file', openbao_bootstrap_selfsigned_artifacts_dir ~ '/' ~ inventory_hostname ~ '.leaf.pem') | trim }}
      {{ lookup('ansible.builtin.file', openbao_bootstrap_selfsigned_ca_cert) | trim }}
    dest: "{{ openbao_bootstrap_selfsigned_leaf_cert }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_using_selfsigned | bool

- name: Issue node sub-CA bootstrap TLS material
  ansible.builtin.include_tasks: issue_node_subca_bootstrap_tls.yml
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'generated_node_subca'

- name: Install generated bootstrap CA certificate
  ansible.builtin.copy:
    src: "{{ openbao_bootstrap_selfsigned_ca_cert }}"
    dest: "{{ openbao_managed_ca_cert_file }}"
    owner: root
    group: "{{ openbao_service_group }}"
    mode: "0644"
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_using_selfsigned | bool

- name: Install generated bootstrap OpenBao listener certificate
  ansible.builtin.copy:
    src: "{{ openbao_bootstrap_tls_effective_cert }}"
    dest: "{{ openbao_tls_cert_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0640"
  notify: Restart OpenBao
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'generated_selfsigned'

- name: Install generated bootstrap OpenBao listener private key
  ansible.builtin.copy:
    src: "{{ openbao_bootstrap_tls_effective_key }}"
    dest: "{{ openbao_tls_key_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0600"
  notify: Restart OpenBao
  no_log: true
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'generated_selfsigned'

- name: Install node sub-CA bootstrap OpenBao listener certificate
  ansible.builtin.copy:
    remote_src: true
    src: "{{ openbao_bootstrap_tls_effective_cert }}"
    dest: "{{ openbao_tls_cert_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0640"
  notify: Restart OpenBao
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'generated_node_subca'
    - openbao_node_subca_bootstrap_issue_needed | default(true) | bool

- name: Install node sub-CA bootstrap OpenBao listener private key
  ansible.builtin.copy:
    remote_src: true
    src: "{{ openbao_bootstrap_tls_effective_key }}"
    dest: "{{ openbao_tls_key_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0600"
  notify: Restart OpenBao
  no_log: true
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'generated_node_subca'
    - openbao_node_subca_bootstrap_issue_needed | default(true) | bool

- name: Install controller bootstrap OpenBao listener certificate
  ansible.builtin.copy:
    src: "{{ openbao_bootstrap_tls_effective_cert }}"
    dest: "{{ openbao_tls_cert_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0640"
  notify: Restart OpenBao
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'controller'

- name: Install controller bootstrap OpenBao listener private key
  ansible.builtin.copy:
    src: "{{ openbao_bootstrap_tls_effective_key }}"
    dest: "{{ openbao_tls_key_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0600"
  notify: Restart OpenBao
  no_log: true
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'controller'

- name: Install node bootstrap OpenBao listener certificate
  ansible.builtin.copy:
    remote_src: true
    src: "{{ openbao_bootstrap_tls_effective_cert }}"
    dest: "{{ openbao_tls_cert_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0640"
  notify: Restart OpenBao
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'node'
    - openbao_node_bootstrap_tls_chain | length == 0

- name: Read node bootstrap OpenBao listener certificate
  ansible.builtin.slurp:
    src: "{{ openbao_bootstrap_tls_effective_cert }}"
  register: openbao_remote_bootstrap_cert_content
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'node'
    - openbao_node_bootstrap_tls_chain | length > 0

- name: Install node bootstrap OpenBao listener certificate with controller-side chain
  ansible.builtin.copy:
    content: |
      {{ openbao_remote_bootstrap_cert_content.content | b64decode | trim }}
      {{ lookup('ansible.builtin.file', openbao_node_bootstrap_tls_chain) | trim }}
    dest: "{{ openbao_tls_cert_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0640"
  notify: Restart OpenBao
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'node'
    - openbao_node_bootstrap_tls_chain | length > 0

- name: Install node bootstrap OpenBao listener private key
  ansible.builtin.copy:
    remote_src: true
    src: "{{ openbao_bootstrap_tls_effective_key }}"
    dest: "{{ openbao_tls_key_file }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0600"
  notify: Restart OpenBao
  no_log: true
  when:
    - openbao_bootstrap_tls_install_needed | bool
    - openbao_bootstrap_tls_effective_source | default('') == 'node'

- name: Validate bootstrap listener certificate parses
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ openbao_tls_cert_file }}"
      - -noout
  register: openbao_bootstrap_cert_parse
  changed_when: false
  failed_when: openbao_bootstrap_cert_parse.rc != 0
  when: openbao_bootstrap_tls_install_needed | bool

- name: Validate bootstrap listener private key parses
  ansible.builtin.command:
    argv:
      - openssl
      - pkey
      - -in
      - "{{ openbao_tls_key_file }}"
      - -noout
  register: openbao_bootstrap_key_parse
  changed_when: false
  failed_when: openbao_bootstrap_key_parse.rc != 0
  no_log: true
  when: openbao_bootstrap_tls_install_needed | bool

- name: Validate bootstrap listener certificate and private key match
  ansible.builtin.shell: |
    set -euo pipefail
    cert_hash="$(
      openssl x509 -in "${OPENBAO_TLS_CERT_FILE}" -pubkey -noout \
        | openssl pkey -pubin -outform DER \
        | openssl dgst -sha256 -binary \
        | openssl base64 -A
    )"
    key_hash="$(
      openssl pkey -in "${OPENBAO_TLS_KEY_FILE}" -pubout -outform DER \
        | openssl dgst -sha256 -binary \
        | openssl base64 -A
    )"
    test "${cert_hash}" = "${key_hash}"
  args:
    executable: /bin/bash
  environment:
    OPENBAO_TLS_CERT_FILE: "{{ openbao_tls_cert_file }}"
    OPENBAO_TLS_KEY_FILE: "{{ openbao_tls_key_file }}"
  register: openbao_bootstrap_key_match
  changed_when: false
  failed_when: openbao_bootstrap_key_match.rc != 0
  no_log: true
  when: openbao_bootstrap_tls_install_needed | bool

- name: Validate bootstrap listener certificate chain
  ansible.builtin.shell: |
    set -euo pipefail
    tmpdir="$(mktemp -d)"
    trap 'rm -rf "${tmpdir}"' EXIT
    leaf="${tmpdir}/leaf.pem"
    chain="${tmpdir}/chain.pem"
    awk -v leaf="${leaf}" -v chain="${chain}" '
      /-----BEGIN CERTIFICATE-----/ { cert_index++ }
      cert_index == 1 { print > leaf }
      cert_index > 1 { print > chain }
    ' "${OPENBAO_TLS_CERT_FILE}"
    test -s "${leaf}"
    if test -s "${chain}"; then
      openssl verify -CAfile "${OPENBAO_CA_CERT_FILE}" -untrusted "${chain}" "${leaf}"
    else
      openssl verify -CAfile "${OPENBAO_CA_CERT_FILE}" "${leaf}"
    fi
  args:
    executable: /bin/bash
  environment:
    OPENBAO_TLS_CERT_FILE: "{{ openbao_tls_cert_file }}"
    OPENBAO_CA_CERT_FILE: "{{ openbao_ca_cert_file }}"
  register: openbao_bootstrap_chain_verify
  changed_when: false
  failed_when: openbao_bootstrap_chain_verify.rc != 0
  when: openbao_bootstrap_tls_install_needed | bool

- name: Validate bootstrap listener certificate DNS names
  ansible.builtin.shell: |
    set -euo pipefail
    cert_text="$(openssl x509 -in "${OPENBAO_TLS_CERT_FILE}" -noout -text)"
    for name in "${OPENBAO_PUBLIC_FQDN}" "${OPENBAO_NODE_FQDN}"; do
      printf '%s\n' "${cert_text}" | grep -F "DNS:${name}" >/dev/null
    done
  args:
    executable: /bin/bash
  environment:
    OPENBAO_TLS_CERT_FILE: "{{ openbao_tls_cert_file }}"
    OPENBAO_PUBLIC_FQDN: "{{ openbao_public_fqdn }}"
    OPENBAO_NODE_FQDN: "{{ openbao_node_fqdn }}"
  register: openbao_bootstrap_dns_names
  changed_when: false
  failed_when: openbao_bootstrap_dns_names.rc != 0
  when: openbao_bootstrap_tls_install_needed | bool

- name: Install static auto-unseal key as raw bytes
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - -c
      - |
        import base64, os, pathlib, sys
        path = pathlib.Path(os.environ["OPENBAO_STATIC_KEY_PATH"])
        raw = base64.b64decode(os.environ["OPENBAO_STATIC_KEY_B64"], validate=True)
        if path.exists() and path.read_bytes() == raw:
            path.chmod(0o600)
            sys.exit(0)
        path.write_bytes(raw)
        path.chmod(0o600)
        sys.exit(2)
  environment:
    OPENBAO_STATIC_KEY_B64: "{{ openbao_static_unseal_key_b64 }}"
    OPENBAO_STATIC_KEY_PATH: "{{ openbao_static_unseal_key_path }}"
  no_log: true
  changed_when: openbao_static_key_write.rc == 2
  failed_when: openbao_static_key_write.rc not in [0, 2]
  register: openbao_static_key_write

- name: Set static auto-unseal key ownership
  ansible.builtin.file:
    path: "{{ openbao_static_unseal_key_path }}"
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0600"
