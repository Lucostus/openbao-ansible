---
- name: Install operating system dependencies
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - curl
      - gzip
      - openssl
      - python3
      - python3-cryptography
      - tar
      - unzip
    state: present

- name: Install NFS utilities when listener ACME cache uses NFS
  ansible.builtin.dnf:
    name: nfs-utils
    state: present
  when:
    - openbao_tls_mode == 'listener_acme'
    - openbao_listener_acme_cache_mode == 'nfs'

- name: Install firewalld when firewall management is enabled
  ansible.builtin.dnf:
    name: firewalld
    state: present
  when: openbao_manage_firewalld | bool

- name: Install SELinux policy tools when SELinux management is enabled
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when: openbao_manage_selinux | bool

- name: Ensure firewalld is running when managed
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: openbao_manage_firewalld | bool

- name: Ensure OpenBao group exists
  ansible.builtin.group:
    name: "{{ openbao_service_group }}"
    system: true
    state: present

- name: Ensure OpenBao user exists
  ansible.builtin.user:
    name: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    home: "{{ openbao_data_dir }}"
    shell: /sbin/nologin
    system: true
    create_home: false
    state: present

- name: Create OpenBao directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(openbao_service_user) }}"
    group: "{{ item.group | default(openbao_service_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ openbao_config_dir }}", mode: "0750" }
    - { path: "{{ openbao_data_dir }}", mode: "0750" }
    - { path: "{{ openbao_raft_path }}", mode: "0750" }
    - { path: "{{ openbao_log_dir }}", mode: "0750" }
    - { path: "{{ openbao_tls_dir }}", mode: "0750" }
    - { path: "{{ openbao_seal_dir }}", mode: "0700" }
    - { path: "{{ openbao_package_cache_dir }}", mode: "0755", owner: root, group: root }

- name: Create OpenBao listener ACME cache directory
  ansible.builtin.file:
    path: "{{ openbao_listener_acme_cache_path }}"
    state: directory
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0750"
  when: openbao_tls_mode == 'listener_acme'

- name: Create OpenBao agent directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ openbao_agent_config_dir }}", mode: "0700" }
    - { path: "{{ openbao_agent_state_dir }}", mode: "0700" }
  when: openbao_agent_enabled | bool

- name: Mount shared OpenBao listener ACME cache
  ansible.posix.mount:
    path: "{{ openbao_listener_acme_cache_path }}"
    src: "{{ openbao_listener_acme_cache_nfs_src }}"
    fstype: "{{ openbao_listener_acme_cache_nfs_fstype }}"
    opts: "{{ openbao_listener_acme_cache_nfs_opts }}"
    state: mounted
  when:
    - openbao_tls_mode == 'listener_acme'
    - openbao_listener_acme_cache_mode == 'nfs'

- name: Remove managed OpenBao listener ACME cache mount when ACME is inactive
  ansible.posix.mount:
    path: "{{ openbao_listener_acme_cache_path }}"
    state: absent
  when:
    - openbao_tls_mode != 'listener_acme'
    - openbao_listener_acme_cache_mode == 'nfs'

- name: Set shared OpenBao listener ACME cache permissions
  ansible.builtin.file:
    path: "{{ openbao_listener_acme_cache_path }}"
    state: directory
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0750"
  when: openbao_tls_mode == 'listener_acme'

- name: Confirm shared OpenBao listener ACME cache is mounted
  ansible.builtin.command:
    argv:
      - findmnt
      - --mountpoint
      - "{{ openbao_listener_acme_cache_path }}"
  changed_when: false
  when:
    - openbao_tls_mode == 'listener_acme'
    - openbao_listener_acme_cache_mode in ['nfs', 'pre_mounted']

- name: Validate OpenBao can write to shared ACME cache
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ openbao_service_user }}"
      - --
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - -c
      - |
        import os, pathlib, tempfile
        cache = pathlib.Path(os.environ["OPENBAO_ACME_CACHE_PATH"])
        with tempfile.NamedTemporaryFile(dir=cache, prefix=".ansible-openbao-write-", delete=False) as handle:
            path = pathlib.Path(handle.name)
            handle.write(b"ok")
        path.unlink()
  environment:
    OPENBAO_ACME_CACHE_PATH: "{{ openbao_listener_acme_cache_path }}"
  changed_when: false
  when: openbao_tls_mode == 'listener_acme'

- name: Check audit log file
  ansible.builtin.stat:
    path: "{{ openbao_audit_log_file }}"
  register: openbao_audit_log_file_stat

- name: Create audit log file when absent
  ansible.builtin.file:
    path: "{{ openbao_audit_log_file }}"
    state: touch
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0640"
  when: not openbao_audit_log_file_stat.stat.exists

- name: Set audit log file permissions
  ansible.builtin.file:
    path: "{{ openbao_audit_log_file }}"
    state: file
    owner: "{{ openbao_service_user }}"
    group: "{{ openbao_service_group }}"
    mode: "0640"

- name: Add OpenBao peer host entries
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].openbao_node_ip | default(hostvars[item].ansible_host) }} {{ hostvars[item].openbao_node_fqdn }}"
    regexp: "\\s{{ hostvars[item].openbao_node_fqdn | regex_escape }}$"
    state: present
    unsafe_writes: true
  loop: "{{ groups[openbao_cluster_group] }}"
  when: openbao_manage_hosts_entries | bool
