---
- name: Open OpenBao listener and cluster ports
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop:
    "{{ [openbao_listener_port, openbao_cluster_port] + ([openbao_native_acme_bootstrap_api_port] if (openbao_certificate_mode == 'native_acme' and openbao_native_acme_bootstrap_api_enabled | bool) else []) }}"
  when: openbao_manage_firewalld | bool

- name: Open HTTP challenge port for native ACME
  ansible.posix.firewalld:
    port: 80/tcp
    permanent: true
    immediate: true
    state: enabled
  when:
    - openbao_manage_firewalld | bool
    - openbao_certificate_mode == 'native_acme'
    - openbao_native_acme_challenge == 'http-01'

- name: Open TLS-ALPN challenge port for native ACME
  ansible.posix.firewalld:
    port: 443/tcp
    permanent: true
    immediate: true
    state: enabled
  when:
    - openbao_manage_firewalld | bool
    - openbao_certificate_mode == 'native_acme'
    - openbao_native_acme_challenge == 'tls-alpn-01'

- name: Allow SELinux OpenBao ports when SELinux is enforcing
  community.general.seport:
    ports:
      - "{{ openbao_listener_port }}"
      - "{{ openbao_cluster_port }}"
    proto: tcp
    setype: http_port_t
    state: present
  when:
    - openbao_manage_selinux | bool
    - ansible_selinux.status | default('disabled') == 'enabled'
