---
- name: Assert lego is the managed external ACME client
  ansible.builtin.assert:
    that:
      - openbao_acme_client == 'lego'
    fail_msg: "This role currently manages lego. Set openbao_acme_client=lego or extend the role for certbot/acme.sh."

- name: Create lego installation workspace
  ansible.builtin.file:
    path: "/tmp/openbao-lego-{{ openbao_lego_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download lego release archive
  ansible.builtin.get_url:
    url: "{{ openbao_lego_download_url }}"
    dest: "/tmp/openbao-lego-{{ openbao_lego_version }}.tar.gz"
    checksum: "{{ openbao_lego_checksum if openbao_lego_checksum | length > 0 else omit }}"
    owner: root
    group: root
    mode: "0644"

- name: Extract lego binary
  ansible.builtin.unarchive:
    src: "/tmp/openbao-lego-{{ openbao_lego_version }}.tar.gz"
    dest: "/tmp/openbao-lego-{{ openbao_lego_version }}"
    remote_src: true
    creates: "/tmp/openbao-lego-{{ openbao_lego_version }}/lego"

- name: Install lego binary
  ansible.builtin.copy:
    src: "/tmp/openbao-lego-{{ openbao_lego_version }}/lego"
    dest: "{{ openbao_lego_install_dir }}/lego"
    owner: root
    group: root
    mode: "0755"
    remote_src: true

- name: Load EAB artifact for this node
  ansible.builtin.slurp:
    src: "{{ openbao_secure_artifacts_dir }}/{{ inventory_hostname }}-eab.json"
  delegate_to: localhost
  become: false
  register: openbao_node_eab_artifact
  no_log: true

- name: Create ACME state directory
  ansible.builtin.file:
    path: "{{ openbao_acme_config_dir }}"
    state: directory
    owner: root
    group: "{{ openbao_service_group }}"
    mode: "0750"

- name: Install ACME DNS provider environment file
  ansible.builtin.copy:
    content: |
      {% for key, value in openbao_acme_dns_env.items() %}
      {{ key }}={{ value | quote }}
      {% endfor %}
    dest: "{{ openbao_acme_dns_env_file }}"
    owner: root
    group: "{{ openbao_service_group }}"
    mode: "0640"
  no_log: true
  when: openbao_acme_challenge == 'dns-01'

- name: Install ACME EAB environment file
  ansible.builtin.copy:
    content: |
      OPENBAO_ACME_DIRECTORY={{ ((openbao_node_eab_artifact.content | b64decode | from_json).directory) | quote }}
      OPENBAO_ACME_EMAIL={{ ((openbao_node_eab_artifact.content | b64decode | from_json).email) | quote }}
      OPENBAO_ACME_EAB_KEY_ID={{ ((openbao_node_eab_artifact.content | b64decode | from_json).key_id) | quote }}
      OPENBAO_ACME_EAB_HMAC_KEY={{ ((openbao_node_eab_artifact.content | b64decode | from_json).hmac_key) | quote }}
    dest: "{{ openbao_acme_eab_env_file }}"
    owner: root
    group: "{{ openbao_service_group }}"
    mode: "0640"
  no_log: true

- name: Install OpenBao listener certificate renewal script
  ansible.builtin.template:
    src: openbao-acme-renew.sh.j2
    dest: /usr/local/sbin/openbao-acme-renew
    owner: root
    group: root
    mode: "0750"

- name: Install ACME renewal systemd service
  ansible.builtin.template:
    src: openbao-renew-listener-cert.service.j2
    dest: "/etc/systemd/system/{{ openbao_acme_renew_service_name }}.service"
    owner: root
    group: root
    mode: "0644"

- name: Install ACME renewal systemd timer
  ansible.builtin.template:
    src: openbao-renew-listener-cert.timer.j2
    dest: "/etc/systemd/system/{{ openbao_acme_renew_service_name }}.timer"
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd for ACME renewal units
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable ACME renewal timer
  ansible.builtin.systemd:
    name: "{{ openbao_acme_renew_service_name }}.timer"
    enabled: true
    state: started

- name: Run ACME renewal immediately when requested
  ansible.builtin.systemd:
    name: "{{ openbao_acme_renew_service_name }}.service"
    state: started
  when: openbao_run_acme_renewal_now | bool
