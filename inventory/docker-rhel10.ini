[rhel10]
rhel10-ansible-1 ansible_host=127.0.0.1 ansible_port=2221
rhel10-ansible-2 ansible_host=127.0.0.1 ansible_port=2224
rhel10-ansible-3 ansible_host=127.0.0.1 ansible_port=2225

[openbao_upgrade_standby]

[openbao_upgrade_active]

[rhel10:vars]
ansible_user=ansible
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
