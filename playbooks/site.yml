---
- name: Validate selected OpenBao deployment target
  hosts: localhost
  become: false
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate OpenBao target group
      ansible.builtin.import_tasks: ../roles/openbao_common/tasks/validate_target_group.yml

- name: Verify OpenBao nodes are reachable before deployment
  hosts: "{{ openbao_target_group | default('rhel10') }}"
  become: false
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Load OpenBao variables
      ansible.builtin.import_tasks: ../roles/openbao_common/tasks/load_openbao_vars.yml
  tasks:
    - name: Assert OpenBao node connectivity
      ansible.builtin.import_tasks: ../roles/openbao_common/tasks/assert_cluster_reachable.yml

- name: Disable OpenBao Agent when Agent renewal is not selected
  hosts: "{{ openbao_target_group | default('rhel10') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    openbao_validate_bootstrap_inputs: false
  pre_tasks:
    - name: Load OpenBao variables
      ansible.builtin.import_tasks: ../roles/openbao_common/tasks/load_openbao_vars.yml
  tasks:
    - name: Stop and disable OpenBao Agent
      ansible.builtin.import_tasks: ../roles/openbao_agent/tasks/disable.yml
      when: not (openbao_agent_enabled | bool)

- name: Prepare OpenBao servers and configure PKI
  hosts: "{{ openbao_target_group | default('rhel10') }}"
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    openbao_validate_bootstrap_inputs: true
  pre_tasks:
    - name: Load OpenBao secret variables
      ansible.builtin.import_tasks: ../roles/openbao_common/tasks/load_openbao_vars.yml
  roles:
    - openbao_common
    - openbao_server
    - openbao_bootstrap
  tasks:
    - name: Configure OpenBao PKI when certificate renewal is selected
      ansible.builtin.include_role:
        name: openbao_pki
      when: openbao_pki_enabled | bool

- name: Converge OpenBao Agent listener certificates
  hosts: "{{ openbao_target_group | default('rhel10') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    openbao_validate_bootstrap_inputs: false
  pre_tasks:
    - name: Load OpenBao secret variables
      ansible.builtin.import_tasks: ../roles/openbao_common/tasks/load_openbao_vars.yml
  roles:
    - role: openbao_agent
      when: openbao_agent_enabled | bool

- name: Converge native listener ACME
  hosts: "{{ openbao_target_group | default('rhel10') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    openbao_validate_bootstrap_inputs: false
    openbao_require_native_acme: true
    openbao_validate_native_acme_certificate: false
  pre_tasks:
    - name: Load OpenBao secret variables
      ansible.builtin.import_tasks: ../roles/openbao_common/tasks/load_openbao_vars.yml
  roles:
    - role: openbao_server
      when: openbao_certificate_mode == 'native_acme'

- name: Validate native listener ACME
  hosts: "{{ openbao_target_group | default('rhel10') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    openbao_validate_bootstrap_inputs: false
  pre_tasks:
    - name: Load OpenBao secret variables
      ansible.builtin.import_tasks: ../roles/openbao_common/tasks/load_openbao_vars.yml
  tasks:
    - name: Validate native ACME certificate for public OpenBao name
      ansible.builtin.shell: >-
        timeout 10 openssl s_client
        -connect {{ (openbao_node_fqdn ~ ':' ~ openbao_listener_port) | quote }}
        -servername {{ openbao_tls_server_name | quote }}
        -verify_hostname {{ openbao_tls_server_name | quote }}
        -CAfile {{ openbao_ca_cert_file | quote }}
        -verify_return_error
        -brief
        < /dev/null
      register: openbao_native_acme_cert_check
      changed_when: false
      until: openbao_native_acme_cert_check.rc == 0
      retries: 12
      delay: 10
      when: openbao_certificate_mode == 'native_acme'

- name: Validate OpenBao deployment
  hosts: "{{ openbao_target_group | default('rhel10') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    openbao_validate_bootstrap_inputs: false
  pre_tasks:
    - name: Load OpenBao secret variables
      ansible.builtin.import_tasks: ../roles/openbao_common/tasks/load_openbao_vars.yml
  tasks:
    - name: Validate final OpenBao site state
      ansible.builtin.import_tasks: ../roles/openbao_common/tasks/validate_site.yml
