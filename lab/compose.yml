---
name: openbao-ansible

services:
  rhel10-ansible-1:
    build:
      context: ./docker/openbao-lab-node
    image: openbao-lab-node:rhel10-ansible-1
    platform: linux/arm64
    privileged: true
    cgroup: host
    command: /usr/sbin/init
    hostname: rhel10-ansible-1
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /tmp
    ports:
      - "127.0.0.1:2221:22"
      - "127.0.0.1:18200:8200"
      - "127.0.0.1:18201:8201"
    extra_hosts:
      - "bao.lab.local:10.89.10.10"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ../secure-artifacts/lab/ssh/id_ed25519.pub:/etc/ssh/authorized_keys/ansible:ro
      - rhel10-ansible-1-data:/var/lib/openbao
      - openbao-acme-cache:/var/lib/openbao/certmagic
    networks:
      openbao_lab:
        ipv4_address: 10.89.10.11

  rhel10-ansible-2:
    build:
      context: ./docker/openbao-lab-node
    image: openbao-lab-node:rhel10-ansible-2
    platform: linux/arm64
    privileged: true
    cgroup: host
    command: /usr/sbin/init
    hostname: rhel10-ansible-2
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /tmp
    ports:
      - "127.0.0.1:2224:22"
      - "127.0.0.1:18210:8200"
      - "127.0.0.1:18211:8201"
    extra_hosts:
      - "bao.lab.local:10.89.10.10"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ../secure-artifacts/lab/ssh/id_ed25519.pub:/etc/ssh/authorized_keys/ansible:ro
      - rhel10-ansible-2-data:/var/lib/openbao
      - openbao-acme-cache:/var/lib/openbao/certmagic
    networks:
      openbao_lab:
        ipv4_address: 10.89.10.12
    depends_on:
      - rhel10-ansible-1

  rhel10-ansible-3:
    build:
      context: ./docker/openbao-lab-node
    image: openbao-lab-node:rhel10-ansible-3
    platform: linux/arm64
    privileged: true
    cgroup: host
    command: /usr/sbin/init
    hostname: rhel10-ansible-3
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /tmp
    ports:
      - "127.0.0.1:2225:22"
      - "127.0.0.1:18220:8200"
      - "127.0.0.1:18221:8201"
    extra_hosts:
      - "bao.lab.local:10.89.10.10"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ../secure-artifacts/lab/ssh/id_ed25519.pub:/etc/ssh/authorized_keys/ansible:ro
      - rhel10-ansible-3-data:/var/lib/openbao
      - openbao-acme-cache:/var/lib/openbao/certmagic
    networks:
      openbao_lab:
        ipv4_address: 10.89.10.13
    depends_on:
      - rhel10-ansible-1

  openbao-lb:
    image: haproxy:3.1-alpine
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8404:8404"
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      openbao_lab:
        ipv4_address: 10.89.10.10
        aliases:
          - bao.lab.local
    depends_on:
      - rhel10-ansible-1
      - rhel10-ansible-2
      - rhel10-ansible-3

  opensearch-mock:
    build:
      context: ./docker/openbao-lab-node
    image: openbao-lab-opensearch-mock:latest
    platform: linux/arm64
    command: python3 /opt/opensearch-mock/server.py
    environment:
      OPENSEARCH_MOCK_USERNAME: openbao-vector
      OPENSEARCH_MOCK_PASSWORD: lab-password
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - ./docker/opensearch-mock/server.py:/opt/opensearch-mock/server.py:ro
      - opensearch-mock-data:/var/lib/opensearch-mock
    networks:
      openbao_lab:
        ipv4_address: 10.89.10.20
        aliases:
          - opensearch.lab.local

networks:
  openbao_lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.10.0/24

volumes:
  rhel10-ansible-1-data:
  rhel10-ansible-2-data:
  rhel10-ansible-3-data:
  openbao-acme-cache:
  opensearch-mock-data:
