---
openbao_cluster_name: openbao-docker-lab
openbao_arch: arm64
openbao_public_fqdn: bao.lab.local
openbao_public_api_addr: https://bao.lab.local:8443
openbao_tls_mode: agent_pki
openbao_tls_bootstrap_source: controller
openbao_pki_cluster_path: "https://{{ openbao_public_fqdn }}:8300/v1/{{ openbao_pki_mount }}"
openbao_pki_cluster_aia_path: "{{ openbao_public_api_addr }}/v1/{{ openbao_pki_mount }}"
openbao_acme_directory: "{{ openbao_pki_cluster_path }}/roles/{{ openbao_acme_role_name }}/acme/directory"
openbao_secure_artifacts_dir: "{{ playbook_dir }}/../secure-artifacts/lab/openbao"

# These values are only used when the lab is explicitly overridden to
# openbao_tls_mode=listener_acme.
openbao_listener_acme_cache_mode: pre_mounted
openbao_listener_acme_cache_nfs_enabled: false
openbao_listener_acme_bootstrap_api_enabled: true
openbao_listener_acme_tls_alpn_routed: true

openbao_manage_firewalld: false
openbao_manage_selinux: false
openbao_systemd_hardening_enabled: false
