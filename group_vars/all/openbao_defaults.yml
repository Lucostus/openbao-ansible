---
openbao_cluster_group: rhel10
openbao_cluster_name: openbao-rhel10

openbao_version: "2.5.3"
openbao_release_arch: amd64
openbao_package_prefix_overrides:
  "2.4.4": bao
openbao_release_base_url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_version }}"
openbao_release_checksum_file: checksums-linux.txt
openbao_package_cache_dir: /var/cache/openbao

openbao_service_user: openbao
openbao_service_group: openbao
openbao_config_dir: /etc/openbao.d
openbao_data_dir: /var/lib/openbao
openbao_raft_path: /var/lib/openbao/raft
openbao_log_dir: /var/log/openbao
openbao_tls_dir: /etc/openbao.d/tls
openbao_seal_dir: /etc/openbao.d/seal
openbao_static_unseal_key_path: /etc/openbao.d/seal/current.key
openbao_static_unseal_key_id: "initial-static-key"
openbao_audit_log_file: /var/log/openbao/audit.log
openbao_audit_enabled: true
openbao_audit_description: OpenBao file audit device
openbao_audit_log_raw: false

openbao_public_fqdn: bao.example.com
openbao_public_api_addr: "https://{{ openbao_public_fqdn }}"
openbao_node_fqdn: >-
  {{
    (openbao_nodes | default({})).get(inventory_hostname, {}).get(
      'fqdn',
      inventory_hostname ~ '.example.com'
    )
  }}
openbao_node_ip: >-
  {{
    (openbao_nodes | default({})).get(inventory_hostname, {}).get(
      'ip',
      (ansible_facts | default({})).get('default_ipv4', {}).get('address', ansible_host)
    )
  }}
openbao_listener_address: "0.0.0.0"
openbao_cluster_bind_address: "0.0.0.0"
openbao_listener_port: 8200
openbao_cluster_port: 8201
openbao_api_addr: "https://{{ openbao_node_fqdn }}:{{ openbao_listener_port }}"
openbao_cluster_addr: "https://{{ openbao_node_fqdn }}:{{ openbao_cluster_port }}"
openbao_cli_addr: "https://{{ openbao_node_fqdn }}:{{ openbao_listener_port }}"
openbao_raft_leader_tls_servername: "{{ openbao_tls_server_name }}"
openbao_lb_mode: tcp_passthrough

openbao_certificate_mode: agent
openbao_bootstrap_tls_source: "{{ 'node' if openbao_certificate_mode == 'agent' else 'controller' }}"
openbao_controller_bootstrap_tls_cert: "{{ playbook_dir }}/../files/bootstrap-tls/{{ inventory_hostname }}.fullchain.pem"
openbao_controller_bootstrap_tls_key: "{{ playbook_dir }}/../files/bootstrap-tls/{{ inventory_hostname }}.key.pem"
openbao_node_bootstrap_tls_chain: ""
openbao_node_bootstrap_tls_dir: /usr/local/lib/cockpitcert
openbao_node_bootstrap_tls_cert: ""
openbao_node_bootstrap_tls_key: ""
openbao_node_bootstrap_tls_cert_candidates:
  - "{{ openbao_node_bootstrap_tls_dir }}/fullchain.pem"
  - "{{ openbao_node_bootstrap_tls_dir }}/{{ openbao_node_fqdn }}.fullchain.pem"
  - "{{ openbao_node_bootstrap_tls_dir }}/{{ inventory_hostname }}.fullchain.pem"
  - "{{ openbao_node_bootstrap_tls_dir }}/cert.pem"
  - "{{ openbao_node_bootstrap_tls_dir }}/{{ openbao_node_fqdn }}.crt"
  - "{{ openbao_node_bootstrap_tls_dir }}/{{ inventory_hostname }}.crt"
  - "{{ openbao_node_bootstrap_tls_dir }}/{{ openbao_node_fqdn }}.pem"
  - "{{ openbao_node_bootstrap_tls_dir }}/{{ inventory_hostname }}.pem"
openbao_node_bootstrap_tls_key_candidates:
  - "{{ openbao_node_bootstrap_tls_dir }}/key.pem"
  - "{{ openbao_node_bootstrap_tls_dir }}/privkey.pem"
  - "{{ openbao_node_bootstrap_tls_dir }}/{{ openbao_node_fqdn }}.key.pem"
  - "{{ openbao_node_bootstrap_tls_dir }}/{{ inventory_hostname }}.key.pem"
  - "{{ openbao_node_bootstrap_tls_dir }}/{{ openbao_node_fqdn }}.key"
  - "{{ openbao_node_bootstrap_tls_dir }}/{{ inventory_hostname }}.key"
openbao_tls_cert_file: "{{ openbao_tls_dir }}/openbao.fullchain.pem"
openbao_tls_key_file: "{{ openbao_tls_dir }}/openbao.key.pem"
openbao_ca_cert_file: "{{ openbao_tls_dir }}/root-ca.pem"
openbao_tls_server_name: "{{ openbao_public_fqdn }}"
openbao_tls_min_version: tls12
openbao_tls_disable_client_certs: true

openbao_x_forwarded_for_authorized_addrs: []
openbao_x_forwarded_for_hop_skips: 0
openbao_x_forwarded_for_reject_not_authorized: true
openbao_x_forwarded_for_reject_not_present: false
openbao_proxy_protocol_behavior: ""
openbao_proxy_protocol_authorized_addrs: []

openbao_native_acme_enabled: "{{ openbao_certificate_mode == 'native_acme' }}"
openbao_native_acme_ca_directory: "{{ openbao_native_acme_directory }}"
openbao_native_acme_test_ca_directory: ""
openbao_native_acme_cache_path: /var/lib/openbao/certmagic
openbao_native_acme_cache_mode: nfs
openbao_native_acme_cache_nfs_enabled: true
openbao_native_acme_cache_nfs_src: ""
openbao_native_acme_cache_nfs_fstype: nfs4
openbao_native_acme_cache_nfs_opts: rw,_netdev,hard,noatime
openbao_native_acme_bootstrap_api_enabled: false
openbao_native_acme_bootstrap_api_address: "0.0.0.0"
openbao_native_acme_bootstrap_api_port: 8300
openbao_native_acme_ca_root: "{{ openbao_ca_cert_file }}"
openbao_native_acme_email: openbao-admin@example.com
openbao_native_acme_domains:
  - "{{ openbao_public_fqdn }}"
openbao_native_acme_eab_key_id: ""
openbao_native_acme_eab_mac_key: ""
openbao_native_acme_http_routed: false
openbao_native_acme_tls_alpn_routed: false

openbao_agent_enabled: "{{ openbao_certificate_mode == 'agent' }}"
openbao_agent_config_dir: /etc/openbao-agent.d
openbao_agent_state_dir: /var/lib/openbao-agent
openbao_agent_bundle_path: "{{ openbao_agent_state_dir }}/listener-bundle.pem"
openbao_agent_bundle_template_path: "{{ openbao_agent_config_dir }}/listener-bundle.ctmpl"
openbao_agent_config_file: "{{ openbao_agent_config_dir }}/openbao-agent.hcl"
openbao_agent_hook_path: /usr/local/libexec/openbao-agent-listener-cert-hook
openbao_agent_vault_addr: "{{ openbao_cli_addr }}"
openbao_agent_auth_mount: approle
openbao_agent_role_id_path: "{{ openbao_agent_config_dir }}/role_id"
openbao_agent_secret_id_path: "{{ openbao_agent_config_dir }}/secret_id"
openbao_agent_token_period: 24h
openbao_agent_secret_id_ttl: 0
openbao_agent_secret_id_num_uses: 0
openbao_agent_rotate_secret_ids: false
openbao_agent_secret_id_bound_cidrs: []
openbao_agent_token_bound_cidrs: []
openbao_agent_role_prefix: openbao-agent-
openbao_agent_role_name: "{{ openbao_agent_role_prefix }}{{ inventory_hostname | lower | regex_replace('[^a-z0-9_-]', '-') }}"
openbao_agent_policy_prefix: openbao-agent-
openbao_agent_policy_name: "{{ openbao_agent_policy_prefix }}{{ inventory_hostname | lower | regex_replace('[^a-z0-9_-]', '-') }}"
openbao_agent_cert_common_name: "{{ openbao_public_fqdn }}"
openbao_agent_cert_dns_names:
  - "{{ openbao_public_fqdn }}"
  - "{{ openbao_node_fqdn }}"
openbao_agent_cert_ip_sans: []
openbao_agent_cert_ttl: "{{ openbao_pki_leaf_ttl }}"
openbao_agent_restart_jitter_seconds: "{{ ((groups[openbao_cluster_group] | sort).index(inventory_hostname)) * 60 }}"
openbao_agent_template_command_timeout: 180s
openbao_agent_approle_artifact: "{{ openbao_secure_artifacts_dir }}/{{ inventory_hostname }}-agent-approle.json"

openbao_disable_mlock: true
openbao_systemd_hardening_enabled: true
openbao_ui: true
openbao_log_level: info
openbao_recovery_shares: 5
openbao_recovery_threshold: 3
openbao_manage_hosts_entries: true
openbao_manage_firewalld: true
openbao_manage_selinux: true
openbao_enable_unauthenticated_metrics: false

openbao_validate_bootstrap_inputs: true
openbao_operator_token: ""
openbao_secure_artifacts_dir: "{{ playbook_dir }}/../secure-artifacts"
openbao_init_artifact: "{{ openbao_secure_artifacts_dir }}/{{ openbao_cluster_name }}-init.json"

openbao_pki_mount: pki_openbao
openbao_pki_intermediate_common_name: OpenBao Listener Intermediate CA
openbao_pki_issuer_name: openbao-listener-intermediate
openbao_pki_intermediate_ttl: 43800h
openbao_pki_intermediate_days: 1825
openbao_pki_leaf_ttl: 2160h
openbao_pki_leaf_max_ttl: 2160h
openbao_pki_cluster_path: "{{ openbao_public_api_addr }}/v1/{{ openbao_pki_mount }}"
openbao_pki_cluster_aia_path: "{{ openbao_public_api_addr }}/v1/{{ openbao_pki_mount }}"
openbao_native_acme_role_name: openbao-listener
openbao_native_acme_challenge: tls-alpn-01
openbao_native_acme_directory: "{{ openbao_public_api_addr }}/v1/{{ openbao_pki_mount }}/roles/{{ openbao_native_acme_role_name }}/acme/directory"
openbao_native_acme_allowed_domains: "{{ openbao_native_acme_domains }}"
