---
# Edit this file for the target three-node OpenBao environment.

openbao_version: "2.5.3"

openbao_public_fqdn: bao.example.com
openbao_public_api_addr: "https://{{ openbao_public_fqdn }}"

openbao_nodes:
  rhel10-ansible-1:
    fqdn: bao1.example.com
    ip: 10.0.0.11
  rhel10-ansible-2:
    fqdn: bao2.example.com
    ip: 10.0.0.12
  rhel10-ansible-3:
    fqdn: bao3.example.com
    ip: 10.0.0.13

# Default production mode. OpenBao starts with one listener cert/key pair per
# host. Preferred real node source names are:
# /usr/local/lib/cockpitcert/{{ inventory_hostname }}.fullchain.pem
# /usr/local/lib/cockpitcert/{{ inventory_hostname }}.key.pem
# FQDN-based names are also auto-detected. For unusual names, set both
# openbao_node_bootstrap_tls_cert and openbao_node_bootstrap_tls_key. When no
# real pair exists yet, Ansible generates temporary bootstrap certs under
# ignored secure-artifacts/ and replaces them after the real files appear.
# If a subordinate CA exists on one or all OpenBao nodes, operators can set
# openbao_bootstrap_tls_missing_strategy=issue_from_node_subca and
# openbao_pki_signing_source=node_subca to bootstrap and renew from that sub-CA
# without copying its private key off the managed node.
openbao_certificate_mode: bootstrap
openbao_bootstrap_tls_source: node
openbao_node_bootstrap_tls_dir: /usr/local/lib/cockpitcert

openbao_manage_hosts_entries: true
openbao_manage_firewalld: true
openbao_manage_selinux: true
